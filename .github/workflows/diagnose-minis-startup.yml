name: diagnose-minis-startup
on:
  push:
    branches: [minis-startup-debug]
permissions:
  contents: read
jobs:
  startup:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build the Minis iSH engine
        run: |
          set -euo pipefail
          uname -m
          for package in meson ninja pkgconf llvm; do
            brew list --versions "$package" >/dev/null 2>&1 || brew install "$package"
          done
          git init "$RUNNER_TEMP/ish"
          git -C "$RUNNER_TEMP/ish" remote add origin https://github.com/OpenMinis/ish-arm64.git
          git -C "$RUNNER_TEMP/ish" fetch --depth 1 origin 0fd17a135e78b7a0cf08a4f5831217bbb76ed22f
          git -C "$RUNNER_TEMP/ish" checkout --detach FETCH_HEAD
          meson setup "$RUNNER_TEMP/ish-build" "$RUNNER_TEMP/ish" -Dguest_arch=arm64 -Dlog=strace --buildtype=release
          meson compile -C "$RUNNER_TEMP/ish-build" -j4 ish
      - name: Compare startup in the actual iSH engine
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          root = temp / 'ish-root'
          for directory in ['bin', 'dev', 'proc', 'tmp', 'root']:
              (root / directory).mkdir(parents=True, exist_ok=True)
          binaries = {
              'upstream': 'https://raw.githubusercontent.com/FrizzleM/siboot/82b808de3a407619be7fbe54b3f313932bb80ade/minis/bin/siboot-aarch64',
              'v2.1.0': 'https://github.com/Jay-Void-BA/SideInstaller/releases/download/v2.1.0/siboot-aarch64',
              'v0.19.0': 'https://github.com/Jay-Void-BA/SideInstaller/releases/download/siboot-v0.19.0/siboot-aarch64',
          }
          failed = False
          for name, url in binaries.items():
              binary = root / 'bin' / name
              subprocess.run(['curl', '-fLsS', '--retry', '3', url, '-o', str(binary)], check=True)
              binary.chmod(0o755)
              for option in ['--version', '--help']:
                  print(f'::group::{name} {option}', flush=True)
                  try:
                      result = subprocess.run([str(temp/'ish-build/ish'), '-r', str(root), '/bin/'+name, option], capture_output=True, text=True, timeout=45)
                      print('Exit:', result.returncode, flush=True)
                      print(result.stdout, flush=True)
                      print(result.stderr[-30000:], flush=True)
                      failed |= result.returncode != 0
                  except subprocess.TimeoutExpired as error:
                      print('TIMEOUT', error.stdout, error.stderr, flush=True)
                      failed = True
                  print('::endgroup::', flush=True)
          raise SystemExit(1 if failed else 0)
          PY
