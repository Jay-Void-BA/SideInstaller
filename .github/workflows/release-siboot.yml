name: release-siboot

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

concurrency:
  group: release-siboot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve the tested Minis release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.existing.outputs.ready }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve Minis release metadata
        id: meta
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          data = json.loads(pathlib.Path('.github/siboot-release.json').read_text())
          version = data['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          notes = pathlib.Path(data['notes'])
          assert notes.parent == pathlib.Path('release-notes') and notes.is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(version=version, tag='siboot-v' + version, notes=str(notes)).items():
                  print(f'{key}={value}', file=output)
          PY

      - name: Skip an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; leaving it intact"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists without a release"
              exit 1
            fi
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish the tested Minis ARM64 release
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download the exact successful checks artifact
        uses: actions/download-artifact@v4
        with:
          name: minis-release-candidate
          path: ${{ runner.temp }}/minis-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify source, target, file ranges, sizes and digests
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          python3 scripts/minis_artifact.py verify "$RUNNER_TEMP/minis-release"
          sh "$RUNNER_TEMP/minis-release/install-minis.sh" --verify "$RUNNER_TEMP/minis-release/siboot-aarch64"
          cd "$RUNNER_TEMP/minis-release"
          sha256sum --check SHA256SUMS

      - name: Publish and mark Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/minis-release"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists; preserving the published release"
            exit 0
          fi
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG exists without a release"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/$NOTES" "$RUNNER_TEMP/minis-notes.md"
          python3 - <<'PYNOTES'
          import json, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])
          build = json.loads((folder / 'minis-release/build-info.json').read_text())
          with (folder / 'minis-notes.md').open('a') as output:
              output.write('\nSHA-256 (`siboot-aarch64`): `' + build['sha256']['siboot-aarch64'] + '`\n')
              output.write('\nSource commit: `' + os.environ['SOURCE_SHA'] + '`\n')
          PYNOTES
          gh release create "$TAG" siboot-aarch64 install-minis.sh SHA256SUMS \
            --target "$SOURCE_SHA" --title "siboot $VERSION · Minis ARM64" \
            --notes-file "$RUNNER_TEMP/minis-notes.md" --latest
