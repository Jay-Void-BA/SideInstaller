name: release-siboot

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

concurrency:
  group: release-siboot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve the tested rootshell release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.existing.outputs.ready }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve WASM release metadata
        id: meta
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          data = json.loads(pathlib.Path('.github/siboot-release.json').read_text())
          version = data['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          notes = pathlib.Path(data['notes'])
          assert notes.parent == pathlib.Path('release-notes') and notes.is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(version=version, tag='siboot-v' + version, notes=str(notes)).items():
                  print(f'{key}={value}', file=output)
          PY

      - name: Skip an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; leaving it intact"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG already exists without a release"
              exit 1
            fi
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

  rootshell:
    name: Build and verify siboot.wasm
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.stage.outputs.sha256 }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Prepare the exact tested source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash scripts/prepare-minis.sh "$RUNNER_TEMP/siboot"
          python3 - <<'PYVERSION'
          import os, pathlib, tomllib
          manifest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'siboot/rootshell/Cargo.toml'
          assert tomllib.loads(manifest.read_text())['package']['version'] == os.environ['VERSION']
          PYVERSION
          rustup target add wasm32-wasip1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/siboot/rootshell/target
          key: rootshell-release-${{ runner.os }}-${{ hashFiles('patches/siboot/retry-local-ipa.patch', 'rust-core/Cargo.lock') }}
          restore-keys: rootshell-release-${{ runner.os }}-

      - name: Build the WASI installer and probes
        working-directory: ${{ runner.temp }}/siboot/rootshell
        run: cargo build --release --locked --target wasm32-wasip1 --bins --examples

      - name: Recheck the module in rootshell's actual Worker
        run: bash scripts/check-rootshell-runtime.sh "$RUNNER_TEMP/siboot/rootshell/target/wasm32-wasip1/release/siboot.wasm" "$RUNNER_TEMP/siboot/rootshell/target/wasm32-wasip1/release/examples/runtime_check.wasm"

      - name: Stage the verified release assets
        id: stage
        run: |
          mkdir -p "$RUNNER_TEMP/rootshell-release"
          cp "$RUNNER_TEMP/siboot/rootshell/target/wasm32-wasip1/release/siboot.wasm" "$RUNNER_TEMP/rootshell-release/siboot.wasm"
          cd "$RUNNER_TEMP/rootshell-release"
          sha256sum siboot.wasm > SHA256SUMS
          echo "sha256=$(cut -d ' ' -f 1 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rootshell-release
          path: ${{ runner.temp }}/rootshell-release/
          if-no-files-found: error

  publish:
    name: Publish the verified rootshell release
    needs: [prepare, rootshell]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: rootshell-release
          path: ${{ runner.temp }}/rootshell-release

      - name: Publish and mark Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          EXPECTED_SHA256: ${{ needs.rootshell.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/rootshell-release"
          sha256sum --check SHA256SUMS
          [[ "$(sha256sum siboot.wasm | cut -d ' ' -f 1)" == "$EXPECTED_SHA256" ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists; preserving the published release"
            exit 0
          fi
          if git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG exists without a release"
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/$NOTES" "$RUNNER_TEMP/rootshell-notes.md"
          python3 - <<'PYNOTES'
          import os, pathlib
          notes = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rootshell-notes.md'
          with notes.open('a') as output:
              output.write('\nSHA-256 (`siboot.wasm`): `' + os.environ['EXPECTED_SHA256'] + '`\n')
              output.write('\nSource commit: `' + os.environ['SOURCE_SHA'] + '`\n')
          PYNOTES
          gh release create "$TAG" siboot.wasm SHA256SUMS --target "$SOURCE_SHA" --title "siboot $VERSION · rootshell" --notes-file "$RUNNER_TEMP/rootshell-notes.md" --latest
