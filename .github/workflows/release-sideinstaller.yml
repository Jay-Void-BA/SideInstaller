name: release-sideinstaller

# A main-branch version change is released only after the checks workflow
# succeeds. Every job checks out that exact tested SHA, including workflow_run
# events, whose github.sha otherwise points at the newest default-branch tip.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (blank uses .github/release.json)"
        required: false
        type: string
      changelog:
        description: 'Markdown notes; blank uses the versioned notes file. Literal \n is accepted.'
        required: false
        type: string
      channel:
        description: "Release channel"
        type: choice
        default: stable
        options: [stable, beta]
      dry_run:
        description: "Build artifacts without publishing"
        type: boolean
        default: false

concurrency:
  group: release-sideinstaller
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_VERSION: "27.1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  prepare:
    name: Resolve the tested release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.existing.outputs.ready }}
      tag: ${{ steps.meta.outputs.tag }}
      marketing_version: ${{ steps.meta.outputs.marketing_version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      channel: ${{ steps.meta.outputs.channel }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version and notes
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: python3 scripts/release_config.py "$RUNNER_TEMP/release-metadata"

      - name: Require passing checks and refuse existing tags
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true ]]; then
            [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]] || { echo '::error::Release from the default branch only'; exit 1; }
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              result="$(gh run list --workflow checks.yml --commit "$SOURCE_SHA" --limit 1 --json conclusion,status --jq '.[0] | .status + ":" + .conclusion')"
              [[ "$result" == completed:success ]] || { echo '::error::The exact release commit must pass checks first'; exit 1; }
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$DRY_RUN" == true ]]; then
              echo "::notice::$TAG exists; this run only builds artifacts"
            elif [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already released; no release will be overwritten"
              exit 0
            else
              echo "::error::$TAG already has a release"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            [[ "$DRY_RUN" == true ]] || { echo "::error::$TAG already exists"; exit 1; }
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.ready == 'true'
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/
          if-no-files-found: error

  ios:
    name: Build the unsigned IPA
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          app=""
          for candidate in "/Applications/Xcode_${XCODE_VERSION}.app" /Applications/Xcode_"${XCODE_VERSION}"_*.app; do
            if [[ -d "$candidate" ]]; then app="$candidate"; break; fi
          done
          if [[ -z "$app" ]]; then
            app="$(xcode-select -p)"
            app="${app%/Contents/Developer}"
            echo "::warning::Xcode $XCODE_VERSION wasn't found; the build script will verify the selected SDK"
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version

      - name: Install build tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          rustup target add aarch64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: cargo-ios-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: cargo-ios-

      - name: Build IPA
        env:
          VERSION: ${{ needs.prepare.outputs.marketing_version }}
          OUTPUT: ${{ runner.temp }}/ipa/SideInstaller.ipa
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: bash scripts/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: ${{ runner.temp }}/ipa/SideInstaller.ipa
          if-no-files-found: error
          retention-days: 14

  minis:
    name: Build the Minis ARM64 installer
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Prepare Minis source
        run: bash scripts/prepare-minis.sh "$RUNNER_TEMP/siboot"

      - name: Build a native ARM64 musl static executable
        env:
          IPA_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}/SideInstaller.ipa
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/siboot:$RUNNER_TEMP/siboot" \
            -w "$RUNNER_TEMP/siboot/minis" \
            -e SIBOOT_DEFAULT_IPA_URL="$IPA_URL" \
            -e 'RUSTFLAGS=-C target-feature=+crt-static -C relocation-model=static' \
            rust:alpine sh -euc '
              apk add --no-cache build-base cmake perl clang linux-headers
              cargo build --release --locked --target aarch64-unknown-linux-musl
            '
          binary="$RUNNER_TEMP/siboot/minis/target/aarch64-unknown-linux-musl/release/siboot"
          file "$binary"
          file "$binary" | grep -q 'ARM aarch64'
          if readelf -l "$binary" | grep -q INTERP; then
            echo '::error::The Minis executable must be statically linked'
            exit 1
          fi

      - name: Package the installer and matching checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/package_minis.py "$RUNNER_TEMP/siboot/minis" \
            "$RUNNER_TEMP/siboot/minis/target/aarch64-unknown-linux-musl/release/siboot" \
            "$RUNNER_TEMP/minis-assets"
          cp patches/siboot/retry-local-ipa.patch "$RUNNER_TEMP/minis-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: release-minis
          path: ${{ runner.temp }}/minis-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release assets
    needs: [prepare, ios, minis]
    if: needs.prepare.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        working-directory: ${{ runner.temp }}/release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          data = json.loads(pathlib.Path('release.json').read_text())
          assert data['source_sha'] == os.environ['SOURCE_SHA']
          assert data['tag'] == os.environ['TAG']
          with zipfile.ZipFile('SideInstaller.ipa') as ipa:
              assert 'Payload/SideInstaller.app/Info.plist' in ipa.namelist()
          PY
          sha256sum SideInstaller.ipa siboot-aarch64 install-minis.sh retry-local-ipa.patch > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" SideInstaller.ipa siboot-aarch64 install-minis.sh retry-local-ipa.patch SHA256SUMS \
            --draft --title "$TAG" --notes-file release-notes.md --target "$SOURCE_SHA"
          if [[ "$CHANNEL" == beta ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"

  sign:
    name: Notify the upstream signer (upstream repository only)
    needs: publish
    if: github.repository == 'FrizzleM/SideInstaller'
    uses: ./.github/workflows/notify-signer.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  altsource:
    name: Update the upstream AltSource
    needs: [prepare, publish]
    if: github.repository == 'FrizzleM/SideInstaller' && needs.prepare.outputs.channel == 'stable'
    permissions:
      contents: write
    uses: ./.github/workflows/update-altsource.yml
