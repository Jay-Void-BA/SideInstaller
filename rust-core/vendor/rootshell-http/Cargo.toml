[package]
name = "rootshell-http"
version = "0.21.0"
edition = "2021"
license = "MIT"
description = "Bounded HTTP/1.1 and WebSocket transport over rootshell's verified native TLS"

[dependencies]
rootshell-runtime = { path = "../rootshell-runtime" }
http = "1"
url = "2"
serde = "1"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }

[workspace]
